name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build log variant
        run: |
          make clean
          make LCExtForward.dylib LOG=1
          mv LCExtForward.dylib LCExtForward-log.dylib

      - name: Build silent dylibs
        run: |
          make LCExtForward.dylib LCExtForwardHost.dylib LOG=0

      - name: Package
        run: |
          mkdir -p dist/LCExtForward
          cp LCExtForward.dylib LCExtForward-log.dylib LCExtForwardHost.dylib LCExtForward.apps SETUP.md dist/LCExtForward/
          (cd dist && zip -r LCExtForward.zip LCExtForward)
          cp dist/LCExtForward/* dist/

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: LCExtForward ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Prebuilt tweaks for LiveContainer (arm64, iOS 16+). See `SETUP.md` for setup.

            - `LCExtForward.dylib` – per-app tweak (silent)
            - `LCExtForward-log.dylib` – per-app tweak with logging (troubleshooting)
            - `LCExtForwardHost.dylib` – host tweak (global tweak folder)
            - `LCExtForward.apps` – opt-in list for the host tweak
            - `LCExtForward.zip` – everything in one archive
          files: |
            dist/LCExtForward.dylib
            dist/LCExtForward-log.dylib
            dist/LCExtForwardHost.dylib
            dist/LCExtForward.apps
            dist/SETUP.md
            dist/LCExtForward.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCExtForward
          path: dist/LCExtForward.zip
